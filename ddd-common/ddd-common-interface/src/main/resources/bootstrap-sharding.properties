# 显示SQL
spring.shardingsphere.props.sql.show=true
#
spring.shardingsphere.datasource.test1.type=com.zaxxer.hikari.HikariDataSource
spring.shardingsphere.datasource.test1.driver-class-name=com.mysql.cj.jdbc.Driver
spring.shardingsphere.datasource.test1.jdbc-url=jdbc:mysql://127.0.0.1:3306/test1?useUnicode=true&serverTimezone=Asia/Shanghai&useSSL=false&autoReconnect=true
spring.shardingsphere.datasource.test1.username=root
spring.shardingsphere.datasource.test1.password=123456
spring.shardingsphere.datasource.test1.max-active=16
# 数据源，单数据库
spring.shardingsphere.datasource.test2.type=com.zaxxer.hikari.HikariDataSource
spring.shardingsphere.datasource.test2.driver-class-name=com.mysql.cj.jdbc.Driver
spring.shardingsphere.datasource.test2.jdbc-url=jdbc:mysql://127.0.0.1:3306/test2?useUnicode=true&serverTimezone=Asia/Shanghai&useSSL=false&autoReconnect=true
spring.shardingsphere.datasource.test2.username=root
spring.shardingsphere.datasource.test2.password=123456
spring.shardingsphere.datasource.test2.max-active=16
#
spring.shardingsphere.datasource.names=test1,test2
spring.shardingsphere.sharding.default-data-source-name=test1

#
#https://blog.csdn.net/w_t_y_y/article/details/121769853
#用于多分片键的复合分片场景
spring.shardingsphere.sharding.tables.test_db.database-strategy.complex.sharding-columns=user_id
spring.shardingsphere.sharding.tables.test_db.database-strategy.complex.algorithm-class-name=com.example.dddinfrastructure.sharding.DbPreciseShardingAlgorithm
#spring.shardingsphere.sharding.default-database-strategy.complex.algorithm-class-name=com.example.dddinfrastructure.sharding.DbPreciseShardingAlgorithm
#spring.shardingsphere.sharding.tables.test_db.actual-data-nodes=test1.test_db_$->{0..1},test2.test_db_$->{0..1}
spring.shardingsphere.sharding.tables.test_db.actual-data-nodes=test1.test_db,test2.test_db_$->{0..1}
#spring.shardingsphere.sharding.tables.test_db.table-strategy.inline.sharding-column=user_id
spring.shardingsphere.sharding.tables.test_db.table-strategy.complex.sharding-columns=user_id
#spring.shardingsphere.sharding.tables.test_db.table-strategy.inline.algorithm-expression=test_db_$->{user_id % 2}
spring.shardingsphere.sharding.tables.test_db.table-strategy.complex.algorithm-class-name=com.example.dddinfrastructure.sharding.TablePreciseShardingAlgorithm
