#默认的数据源
spring.datasource.default.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.default.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.default.jdbc-url=jdbc:mysql://127.0.0.1:3306/test1?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC
spring.datasource.default.username=root
spring.datasource.default.password=123456
#spring.datasource.default.test-on-borrow=false
#spring.datasource.default.test-while-idle=true
#spring.datasource.default.time-between-eviction-runs-millis=3600000
#额外的数据源
spring.datasource.replication.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.replication.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.replication.jdbc-url=jdbc:mysql://127.0.0.1:3306/test2?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC
spring.datasource.replication.enabled=true
spring.datasource.replication.username=root
spring.datasource.replication.password=123456
