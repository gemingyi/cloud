#
server.port=7777
spring.application.name=common-server
spring.profiles.active=dev
# DataSourceAspect DruidConfig
#spring.profiles.include=datasource
# ShardingAspect DbPreciseShardingAlgorithm TablePreciseShardingAlgorithm
spring.profiles.include=sharding
# admin
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# mybatis
mybatis-plugin.explain.enabled=true
mybatis-plus.mapper-locations=classpath*:/mappers/*.xml
mybatis-plus.type-aliases-package=com.example.dddinfrastructure.eo.*


