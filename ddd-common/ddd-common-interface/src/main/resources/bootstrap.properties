thread.pool.threadPoolConfig[1].corePoolSize=1
thread.pool.threadPoolConfig[1].threadPoolName=test2
thread.pool.threadPoolConfig[1].queueCapacity=10
thread.pool.threadPoolConfig[1].maxPoolSize=2
thread.pool.threadPoolConfig[1].keepAliveSeconds=120